<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Selva - Lodge & Spa de Luxo | Amazônia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- 1. Reset -->
    <link rel="stylesheet" href="css/reset.css">
    <!-- 2. Variáveis globais (cores, fontes, sombras) -->
    <link rel="stylesheet" href="css/variables.css">
    <!-- 3. Estilos base e utilitários -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/buttons.css">
    <!-- 4. Estilos por seção/componente -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/chalets.css">
    <link rel="stylesheet" href="css/gastronomy-spa.css">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/accordion.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/modal.css">
    <!-- 5. Responsivo (sempre por último) -->
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Cada seção é carregada dinamicamente de partials/*.html pelo js/loader.js -->
    <div id="app">
        <div data-include="partials/header.html"></div>
        <div data-include="partials/hero.html"></div>
        <div data-include="partials/about.html"></div>
        <div data-include="partials/chalets.html"></div>
        <div data-include="partials/gastronomy-spa.html"></div>
        <div data-include="partials/widgets.html"></div>
        <div data-include="partials/gallery.html"></div>
        <div data-include="partials/faq.html"></div>
        <div data-include="partials/contact.html"></div>
        <div data-include="partials/footer.html"></div>
        <div data-include="partials/modal-booking.html"></div>
        <div data-include="partials/modal-lightbox.html"></div>
    </div>

    <!-- Carregador de partials HTML (deve vir primeiro) -->
    <script src="js/loader.js"></script>

    <!-- Dados estáticos -->
    <script src="js/data.js"></script>
    <!-- Estado global da aplicação -->
    <script src="js/state.js"></script>
    <!-- Função utilitária -->
    <script src="js/utils.js"></script>
    <!-- Módulos por funcionalidade -->
    <script src="js/header-nav.js"></script>
    <script src="js/chalets.js"></script>
    <script src="js/search.js"></script>
    <script src="js/booking-wizard.js"></script>
    <script src="js/checklist.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/accordion.js"></script>
    <script src="js/contact.js"></script>
    <!-- Inicialização geral (deve vir por último) -->
    <script src="js/main.js"></script>
</body>
</html>
