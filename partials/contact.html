    <section class="section-padding container" id="contato">
        <div class="contact-grid">
            <div>
                <span class="section-tagline" data-i18n="contact.tagline">Localização Privilegiada</span>
                <h2 class="section-title" data-i18n="contact.title">Como Chegar ao Nosso Santuário</h2>
                <p style="margin-bottom: 1.5rem; color: var(--color-text-muted);" data-i18n="contact.coords">Coordenadas Geográficas: 3°08'24.1"S 60°01'42.2"W - Arquipélago de Anavilhanas, Novo Airão, AM.</p>
                <div style="background-color: var(--color-cream-paper); padding: 1.5rem; border-radius: var(--radius-sm); border-left: 4px solid var(--color-gold);">
                    <h4 style="color: var(--color-forest-dark); margin-bottom: 0.5rem;" data-i18n="contact.centerTitle">Central de Atendimento Privativo</h4>
                    <p style="font-size: 0.9rem;"><strong>WhatsApp:</strong> +55 (92) 99182-4020</p>
                    <p style="font-size: 0.9rem;"><strong>E-mail:</strong> reservas@hotelselvalodge.com.br</p>
                </div>
            </div>

            <form class="contact-form" id="contact-form" onsubmit="handleContactSubmit(event)">
                <h3 style="font-family: var(--font-heading); font-size: 1.4rem; color: var(--color-forest-dark); margin-bottom: 1rem;" data-i18n="contact.formTitle">Envie uma Mensagem</h3>
                <div class="form-group">
                    <label for="contact-name" data-i18n="contact.nameLabel">Seu Nome Completo</label>
                    <input id="contact-name" type="text" required data-i18n-placeholder="contact.namePlaceholder" placeholder="Ex: Maria Silva">
                </div>
                <div class="form-group">
                    <label for="contact-email" data-i18n="contact.emailLabel">E-mail de Contato</label>
                    <input id="contact-email" type="email" required data-i18n-placeholder="contact.emailPlaceholder" placeholder="maria@email.com">
                </div>
                <div class="form-group">
                    <label for="contact-msg" data-i18n="contact.msgLabel">Mensagem ou Solicitação Especial</label>
                    <textarea id="contact-msg" rows="4" required data-i18n-placeholder="contact.msgPlaceholder" placeholder="Como podemos personalizar sua estadia?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="contact.submitBtn">Enviar Mensagem</button>
            </form>
        </div>
    </section>
